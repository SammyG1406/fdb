upstream gateway_pool {
    server gateway:3000;
    keepalive 32;
}

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name calepoft.com www.calepoft.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name calepoft.com www.calepoft.com;

    ssl_certificate     /etc/letsencrypt/live/calepoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calepoft.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Gateway API
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://gateway_pool;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Health check
    location /health {
        proxy_pass http://gateway_pool/health;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass         http://frontend:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
