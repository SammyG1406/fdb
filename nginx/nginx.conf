upstream gateway_pool {
    # Round-robin across all gateway replicas spun up by --scale gateway=N
    server gateway:3000;

    keepalive 32;
}

server {
    listen 80;

    # Pass real client IP to downstream services
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Gateway API
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://gateway_pool;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Health check endpoint (used by cloud load balancers / uptime monitors)
    location /health {
        proxy_pass http://gateway_pool/health;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass         http://frontend:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
